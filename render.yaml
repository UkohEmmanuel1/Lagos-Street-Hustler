services:
  - type: web
    name: lagos-life-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lagos-life-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://lagos-life-frontend.onrender.com

  - type: web
    name: lagos-life-frontend
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://lagos-life-api.onrender.com

  - type: keyvalue
    name: lagos-life-redis
    plan: free

databases:
  - name: lagos-life-db
    plan: free
