services:
  - type: web
    name: lagos-street-hustler-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lagos-street-hustler-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: lagos-street-hustler-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run typecheck && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: lagos-street-hustler-db
    plan: free
