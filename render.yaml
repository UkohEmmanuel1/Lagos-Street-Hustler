services:
  - type: web
    name: lagos-life-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  - type: web
    name: lagos-life-frontend
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://lagos-life-api.onrender.com

  - type: keyvalue
    name: lagos-life-redis
    plan: free

databases:
  - name: lagos-life-db
    plan: free
